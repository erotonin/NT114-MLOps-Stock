name: "5. Restart API Pods"

on:
  workflow_run:
    workflows: ["2. Model Training Pipeline"]
    types: [completed]
  workflow_dispatch:


permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  restart-api:
    name: Restart API Pods on EKS
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, k3s, mlops]

    steps:
      - name: Configure AWS Credentials (Lab Environment)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install AWS CLI
        run: pip install awscli

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name mlops-stock

      - name: Restart API Pods (Hot-Reload Models)
        run: |
          echo "Triggering rolling restart for API services..."
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/ || mv kubectl /tmp/kubectl && export PATH=$PATH:/tmp
          fi
          
          kubectl rollout restart deployment/tft-api deployment/lgbm-api deployment/ensemble-api deployment/data-api -n mlops-stock-prod
          
          kubectl rollout status deployment/tft-api -n mlops-stock-prod --timeout=120s
          kubectl rollout status deployment/lgbm-api -n mlops-stock-prod --timeout=120s
          kubectl rollout status deployment/ensemble-api -n mlops-stock-prod --timeout=120s
          kubectl rollout status deployment/data-api -n mlops-stock-prod --timeout=120s
          echo "Rolling restart completed."
