name: "2. Model Training Pipeline"

on:
  push:
    branches: [main]
    paths: ['src/**', 'kfp_pipeline.py', 'run_pipeline.py', 'Dockerfile.training', 'requirements.txt']
  workflow_run:
    workflows: ["1. Data Ingestion & Versioning"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: mlops-stock-trainer

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  security-checks:
    name: Run Security Gate
    uses: ./.github/workflows/security-checks.yml
    secrets: inherit

  build-scan-sign:
    name: Build -> Scan -> Push -> Sign
    needs: security-checks
    runs-on: [self-hosted, k3s, mlops]
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.actions-runner-system.svc.cluster.local:1234
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract tags
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          SHA_TAG="${IMAGE}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${IMAGE}:latest" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: DVC Pull Data
        run: |
          pip install -r .github/requirements.txt
          dvc remote modify --local myaws access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          dvc remote modify --local myaws secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          dvc remote modify --local myaws session_token ${{ secrets.AWS_SESSION_TOKEN }}
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
          export AWS_REGION=us-east-1
          dvc pull || echo "No DVC data to pull yet"
          mkdir -p data
      - name: Build Image (export to tar)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.training
          push: false
          outputs: type=docker,dest=/tmp/trainer.tar
          tags: ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-cache:trainer
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-cache:trainer,mode=min
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          cache: false
          cache-dir: /tmp/trivy-cache
          input: '/tmp/trainer.tar'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
      - name: Trivy SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          cache: false
          cache-dir: /tmp/trivy-cache
          input: '/tmp/trainer.tar'
          format: 'sarif'
          output: 'trivy-trainer.sarif'
          severity: 'HIGH,CRITICAL'
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-trainer.sarif'
          category: 'trivy-trainer'
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4
      - name: Push Image with crane
        run: |
          crane auth login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }} index.docker.io
          crane push /tmp/trainer.tar ${{ steps.meta.outputs.sha_tag }}
          crane tag ${{ steps.meta.outputs.sha_tag }} latest
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign Trainer Image
        run: |
          cosign sign --yes ${{ steps.meta.outputs.sha_tag }}
          cosign sign --yes ${{ steps.meta.outputs.latest_tag }}
      - name: Cleanup
        if: always()
        run: rm -f /tmp/trainer.tar

  submit-kubeflow-pipeline:
    name: Compile & Submit KFP
    runs-on: [self-hosted, k3s, mlops]
    needs: build-scan-sign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install KFP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt
      - name: Compile & Submit Kubeflow Pipeline
        env:
          KFP_HOST: "http://ml-pipeline.kubeflow.svc.cluster.local:8888"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: "us-east-1"
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          export TRAINER_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/mlops-stock-trainer:sha-${SHA_SHORT}"
          python run_pipeline.py
