apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  labels:
    app: control-api
    {{- include "mlops-stock.labels" . | nindent 4 }}
spec:
{{- if not .Values.controlApi.autoscaling.enabled }}
  replicas: {{ .Values.controlApi.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      app: control-api
  template:
    metadata:
      labels:
        app: control-api
    spec:
      serviceAccountName: {{ include "mlops-stock.serviceAccountName" . }}
      containers:
        - name: control-api
          image: "{{ .Values.controlApi.image.repository }}:{{ .Values.controlApi.image.tag }}"
          imagePullPolicy: {{ .Values.controlApi.image.pullPolicy }}
          env:
            - name: CONTROL_DB_PATH
              value: "/app/artifacts/control_plane.sqlite3"
            - name: REGISTRY_PATH
              value: "/app/artifacts/registry/registry.json"
            - name: CONTROL_ALLOWED_ORIGINS
              value: {{ .Values.controlApi.allowedOrigins | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.controlApi.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: control-api
  labels:
    app: control-api
    {{- include "mlops-stock.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controlApi.service.type }}
  ports:
    - port: {{ .Values.controlApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: control-api
